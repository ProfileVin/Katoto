appId: com.Katoto.app
productName: Katoto
directories:
  buildResources: build
  # outside the workspace: VS Code's extension host locks default_app.asar inside it (EPERM on rename)
  output: ../Katoto-dist
files:
  - out/**
  - package.json
  - '!**/*.map'
win:
  executableName: Katoto
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
